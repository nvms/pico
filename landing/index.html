<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Pico is a desktop coding agent for macOS.">
  <title>Pico - A desktop coding agent for macOS</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Pico home"><img src="./logo.svg" width="30" height="30" alt=""><span>pico</span></a>
      <a class="releases" href="https://github.com/nvms/pico-releases/releases">Releases</a>
    </header>
    <main>
      <section class="hero" aria-labelledby="headline">
        <div class="intro">
          <h1 id="headline">A desktop coding agent for macOS.</h1>
          <div class="download">
            <a class="button" href="https://github.com/nvms/pico-releases/releases/latest">Download for Mac <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5"/></svg></a>
            <span class="platform">macOS / Apple Silicon</span>
          </div>
        </div>
        <picture class="preview">
          <source media="(prefers-color-scheme: dark)" srcset="./ss_1_dark.png">
          <img src="./ss_1_light.png" width="4336" height="2644" alt="Pico desktop application" fetchpriority="high">
        </picture>
        <ul class="features" aria-label="Features">
          <li>Multiple projects and sessions</li>
          <li>Parallel background agents</li>
          <li>Built-in browser and Git tools</li>
          <li>ChatGPT sign-in or your own API keys</li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
