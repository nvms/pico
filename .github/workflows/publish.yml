name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  helper:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: make helper
      - uses: actions/upload-artifact@v4
        with:
          name: pico-dictate
          path: packages/pico/dist/pico-dictate
          if-no-files-found: error
  publish:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: pico-dictate
          path: packages/pico/dist
      - run: chmod +x packages/pico/dist/pico-dictate
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public -w picocode-core
      - run: npm publish --access public -w picocode
